<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/style.css">
    <title>Port Checker</title>
</head>

<body>
    <div class="box">
        <h1>Port Checker</h1>
        <form id="port-checker-form" class="port-checker-form">
            <input type="text" id="host" placeholder="Enter URL" required>
            <br>
            <input type="number" id="port" placeholder="Enter Port" required>
            <br><br>
            <button type="submit">Check Port</button>
        </form>
        <div id="result"></div>

    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>

</html>
